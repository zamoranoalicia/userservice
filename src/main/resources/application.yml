spring:
  application:
    name: UserService

  datasource:
    url: jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  h2:
    console:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    user:
      name: admin
      password: password

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method

security:
  jwt:
    api-key: ${JWT_API_KEY}
    expiration: 3600000

openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
