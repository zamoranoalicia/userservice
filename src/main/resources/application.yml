spring:
  application:
    name: UserService

  datasource:
    url: jdbc:h2:mem:usersdb;
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  h2:
    console:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    user:
      name: admin
      password: password

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method

security:
  jwt:
    secret: hDAbZQ2bjKWQ2syuUUf1By6O/08vgnnWxiWEWTQ846XkGkfasZAYT06RhQfYFwW0GmlLUgvUuNbLERIPhAQzzw==
    accessMinutes: 15
    refreshDays: 7

openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}

logging:
  level:
    org.springframework.security: DEBUG

config:
  user:
    domain :
      value: 'dominio.cl'
      errorMessage: "El correo electrónico debe pertenecer al dominio 'dominio.cl'."
    email:
      errorMessage: "Correo electrónico inválido, por favor verifique e intente nuevamente."
      duplicateErrorMessage: "El correo electrónico ya está registrado, por favor intente con otro."
  password:
    regex: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
    errorMessage: |
      Contraseña inválida, por favor verifique e intente nuevamente.
      Al menos una letra minúscula es requerida.
      Al menos una letra mayúscula es requerida.
      Al menos un dígito es requerido.
      Al menos un carácter especial (@$!%*?&) es requerido.
      La longitud mínima de 8 caracteres es requerida.
