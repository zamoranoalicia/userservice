spring:
  application:
    name: "UserService"
    datasource:
      url: jdbc:h2:mem:usersdb
      username: sa
      password:
      driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: false
  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      operationsSorter: method
  security:
    user:
      name: admin
      password: password
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    apiKey: 08942409d601fc0398683ffe60cf683f685d547c685ee12aecf602a99338cd5e
    expiration: 3600000 # 1 hour in milliseconds
